# Supabase / Meoo 云服务配置
#
# 这个文件的存在本身就是一项安全决策记录，请连同注释一起读。

[functions.meoo-ai]
# ---------------------------------------------------------------------------
# verify_jwt = false 是刻意的选择，不是遗漏。
#
# 为什么必须是 false：
#   本项目前端是纯静态页面（GitHub Pages），没有登录体系，也没有可安全存放
#   Supabase anon key 的地方。若 verify_jwt = true，浏览器每次调用都得带
#   Authorization: Bearer <anon key>，而那把 key 同样会明文躺在静态页里——
#   既挡不住任何人，又会让「平台凭据」和「上游 API 凭据」在同一个请求头里混淆
#   （函数早期版本正是因此把 Authorization 当上游 Bearer 转发，造成凭据外泄）。
#
# false 带来的风险以及对应的补偿措施（都在 index.ts 里）：
#   1. 函数对全网可达
#      -> GATEWAY_ALLOWED_ORIGINS 限定调用来源；生产环境务必配置。
#   2. 轨道 A 花的是平台密钥，可能被人白嫖
#      -> 输出上限 16384 tokens、消息 <= 32 条、输入 <= 60000 字符，超限 413。
#   3. 轨道 B 可能被当成开放代理
#      -> 目标必须 https、非私有网段、且在 PROXY_ALLOWED_HOSTS 放行名单内，
#         并对每一次重定向逐跳重新校验。
#   4. 上游挂住会一直占着连接并计费
#      -> UPSTREAM_TIMEOUT_MS 控制的超时（默认 120s）。
#
# 如果之后接入了真正的用户登录体系，应当把这里改回 true，
# 并让前端携带登录态签发的 JWT，届时上面的补偿措施仍应保留。
# ---------------------------------------------------------------------------
verify_jwt = false
